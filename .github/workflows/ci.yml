name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - service: gateway
            path: services/gateway
          - service: auth-service
            path: services/auth-service
          - service: files-service
            path: services/files-service
          - service: upload-service
            path: services/upload-service
          - service: thumbnail-worker
            path: services/thumbnail-worker
          - service: notification-service
            path: services/notification-service
          - service: web
            path: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Run linter (if present)
        working-directory: ${{ matrix.path }}
        run: npm run lint --if-present

      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: npm test --if-present

      - name: Build application (if present)
        working-directory: ${{ matrix.path }}
        run: npm run build --if-present

  build-scan-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    needs: [test-and-lint]
    strategy:
      matrix:
        include:
          - service: gateway
            path: services/gateway
          - service: auth-service
            path: services/auth-service
          - service: files-service
            path: services/files-service
          - service: upload-service
            path: services/upload-service
          - service: thumbnail-worker
            path: services/thumbnail-worker
          - service: notification-service
            path: services/notification-service
          - service: web
            path: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Build Docker image
        run: docker build -t cloudvault-${{ matrix.service }}:${{ github.sha }} ./${{ matrix.path }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'cloudvault-${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          # Ensure repository name is lowercase for GHCR
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$REPO/cloudvault-${{ matrix.service }}
          
          docker tag cloudvault-${{ matrix.service }}:${{ github.sha }} $IMAGE_ID:${{ github.sha }}
          docker tag cloudvault-${{ matrix.service }}:${{ github.sha }} $IMAGE_ID:latest
          
          docker push $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest
