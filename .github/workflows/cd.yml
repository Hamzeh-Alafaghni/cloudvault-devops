name: cd

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      INGRESS_URL: ${{ secrets.INGRESS_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to cluster
        run: |
          echo "Setting up Kubeconfig securely..."
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to cluster via Kustomize
        run: |
          test -n "$INGRESS_URL" || { echo "INGRESS_URL secret is required" >&2; exit 1; }
          kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout status
        run: |
          for resource in \
            deployment/prod-gateway \
            deployment/prod-auth-service \
            deployment/prod-files-service \
            deployment/prod-upload-service \
            deployment/prod-notification-service \
            deployment/prod-thumbnail-worker \
            deployment/prod-web; do
            kubectl rollout status "$resource" --timeout=180s
          done

      - name: Smoke test
        run: |
          for attempt in {1..12}; do
            response=$(curl --fail --silent --show-error "$INGRESS_URL/healthz" || true)
            if printf '%s' "$response" | grep -q '"status":"ok"'; then
              echo "Smoke test passed: $response"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed completely!"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deploy or smoke test failed; initiating auto-rollback..."
          for resource in \
            deployment/prod-gateway \
            deployment/prod-auth-service \
            deployment/prod-files-service \
            deployment/prod-upload-service \
            deployment/prod-notification-service \
            deployment/prod-thumbnail-worker \
            deployment/prod-web; do
            kubectl rollout undo "$resource" || true
          done
          echo "Rollback requested. Failing the pipeline so the broken release is visible."
          exit 1
