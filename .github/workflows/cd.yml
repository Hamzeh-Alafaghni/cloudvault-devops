name: cd

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to cluster
        run: |
          echo "Setting up Kubeconfig securely..."
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to cluster via Kustomize
        run: |
          echo "Applying k8s/overlays/prod..."
          kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout status
        run: |
          echo "Waiting for deployments to become healthy..."
          kubectl rollout status deployment/gateway --timeout=90s
          kubectl rollout status deployment/auth-service --timeout=90s
          kubectl rollout status deployment/files-service --timeout=90s
          kubectl rollout status deployment/upload-service --timeout=90s
          kubectl rollout status deployment/notification-service --timeout=90s
          kubectl rollout status deployment/web --timeout=90s

      - name: Smoke test
        run: |
          echo "Running smoke test against Gateway health endpoint..."
          # In a real environment, replace localhost with the ALB / Ingress URL
          INGRESS_URL="http://localhost:8080"
          
          # Retry loop for smoke test
          for i in {1..5}; do
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" $INGRESS_URL/healthz || echo "failed")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Smoke test passed!"
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 5s..."
            sleep 5
          done
          echo "Smoke test failed completely!"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deploy or smoke test failed! Initiating auto-rollback..."
          kubectl rollout undo deployment/gateway
          kubectl rollout undo deployment/auth-service
          kubectl rollout undo deployment/files-service
          kubectl rollout undo deployment/upload-service
          kubectl rollout undo deployment/notification-service
          kubectl rollout undo deployment/web
          echo "Rollback complete. Exiting with error to fail the pipeline."
          exit 1
