apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: cloudvault-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
        envFrom:
        - configMapRef:
            name: cloudvault-config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  ports:
  - port: 5173
  selector:
    app: web
